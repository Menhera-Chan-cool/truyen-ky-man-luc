name: Novel bilingual alignment
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novel-alignment
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check for published work
        id: queue
        env:
          NOVEL_ALIGNMENT_SUPABASE_URL: ${{ vars.NOVEL_ALIGNMENT_SUPABASE_URL }}
          NOVEL_ALIGNMENT_SERVICE_ROLE_KEY: ${{ secrets.NOVEL_ALIGNMENT_SERVICE_ROLE_KEY }}
        run: node scripts/align-novel/preflight.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.queue.outputs.has_job == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/align-novel/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.queue.outputs.has_job == 'true'
        with:
          path: .alignment-cache
          key: novel-models-${{ runner.os }}-${{ hashFiles('scripts/align-novel/models.json') }}
      - name: Install worker dependencies
        if: steps.queue.outputs.has_job == 'true'
        run: |
          npm ci
          python -m pip install -r scripts/align-novel/requirements.txt
      - name: Align up to three published chapters
        if: steps.queue.outputs.has_job == 'true'
        env:
          NOVEL_ALIGNMENT_SUPABASE_URL: ${{ vars.NOVEL_ALIGNMENT_SUPABASE_URL }}
          NOVEL_ALIGNMENT_SERVICE_ROLE_KEY: ${{ secrets.NOVEL_ALIGNMENT_SERVICE_ROLE_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: npx tsx scripts/align-novel/worker.ts --first-job .alignment-work/first-job.json --max 3
